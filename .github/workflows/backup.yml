name: Daily D1 backup

on:
  schedule:
    # 毎日04:23 JST。GitHubの混雑を避けて毎時0分からずらす。
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'mmhige0/songtypingtheater-ranking' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export, validate restore and encrypt
        run: npm run backup -- create
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Save encrypted backup for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/encrypted/*.sql.gz.enc
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Clean up
        if: always()
        run: rm -rf backups/encrypted
