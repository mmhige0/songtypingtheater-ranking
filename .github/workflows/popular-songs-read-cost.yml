name: Popular songs read cost
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/lib/popular-songs.ts
      - src/lib/page-features.ts
      - scripts/measure-popular-songs.mjs
      - .github/workflows/popular-songs-read-cost.yml
permissions:
  contents: read
jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Measure one uncached SELECT (read only)
        run: node scripts/measure-popular-songs.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
