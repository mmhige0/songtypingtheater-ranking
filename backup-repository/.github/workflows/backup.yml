name: Daily D1 backup

on:
  schedule:
    - cron: '23 19 * * *' # 04:23 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check privacy, export and validate restore
        run: npm run backup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Store compressed SQL for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/*.sql.gz
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Clean up
        if: always()
        run: python3 -c "import shutil; shutil.rmtree('backups', ignore_errors=True)"
